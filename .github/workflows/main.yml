name: Build PocketAERO APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (master channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Verify versions
        run: |
          flutter --version
          dart --version

      - name: Fix CMakeLists.txt hardcoded paths
        run: |
          # The CMakeLists.txt is at android/app/src/main/cpp/CMakeLists.txt
          CMAKE_FILE="android/app/src/main/cpp/CMakeLists.txt"
          
          echo "Original CMakeLists.txt:"
          cat "$CMAKE_FILE"
          
          # Fix hardcoded path by replacing with relative path
          # Change /home/rose/Compiled/AndAERO/libaeroambe to ${CMAKE_CURRENT_SOURCE_DIR}/libaeroambe
          sed -i 's|/home/rose/Compiled/AndAERO/libaeroambe|${CMAKE_CURRENT_SOURCE_DIR}/libaeroambe|g' "$CMAKE_FILE"
          
          echo -e "\n\nFixed CMakeLists.txt:"
          cat "$CMAKE_FILE"

      - name: Ensure libaeroambe directory exists
        run: |
          # Check if the libaeroambe directory exists in the cpp folder
          if [ ! -d "android/app/src/main/cpp/libaeroambe" ]; then
            echo "Warning: libaeroambe directory not found. Creating symlink or structure..."
            # Try to find libaeroambe elsewhere in the project
            find . -name "libaeroambe" -type d 2>/dev/null || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketaero-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
