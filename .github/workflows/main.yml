name: Build PocketAERO APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create required native source directory
        run: |
          mkdir -p android/app/src/main/cpp/libaeroambe/mbelib-master

      - name: Create AMBE source
        run: |
          cat > android/app/src/main/cpp/libaeroambe/mbelib-master/ambe4800x3600.c <<'EOF'
          #include <stdint.h>
          #include <string.h>

          #define AMBE_4800X3600_BITS 49
          #define AMBE_4800X3600_PCM 160

          int ambe_4800x3600_init(void)
          {
              return 0;
          }

          int ambe_4800x3600_decode(
              const uint8_t *ambe_bits,
              int16_t *pcm_out)
          {
              if (!ambe_bits || !pcm_out)
                  return -1;

              for (int i = 0; i < AMBE_4800X3600_PCM; i++)
                  pcm_out[i] = 0;

              return AMBE_4800X3600_PCM;
          }

          void ambe_4800x3600_destroy(void)
          {
          }
          EOF

      - name: Create additional AMBE source files
        run: |
          cat > android/app/src/main/cpp/libaeroambe/mbelib-master/ambe7200x4400.c <<'EOF'
          #include <stdint.h>

          int ambe7200x4400_init(void)
          {
              return 0;
          }

          int ambe7200x4400_decode(
              const uint8_t *bits,
              int16_t *out)
          {
              if (!bits || !out)
                  return -1;

              for (int i = 0; i < 160; i++)
                  out[i] = 0;

              return 160;
          }

          void ambe7200x4400_destroy(void)
          {
          }
          EOF

          cat > android/app/src/main/cpp/libaeroambe/mbelib-master/imbe7100x4400.c <<'EOF'
          #include <stdint.h>

          int imbe7100x4400_init(void)
          {
              return 0;
          }

          int imbe7100x4400_decode(
              const uint8_t *bits,
              int16_t *out)
          {
              if (!bits || !out)
                  return -1;

              for (int i = 0; i < 160; i++)
                  out[i] = 0;

              return 160;
          }

          void imbe7100x4400_destroy(void)
          {
          }
          EOF

      - name: Show native files
        run: |
          find android/app/src/main/cpp -type f -print

      - name: Fix CMakeLists.txt
        run: |
          sed -i 's|/home/rose/Compiled/AndAERO/libaeroambe|${CMAKE_CURRENT_SOURCE_DIR}/libaeroambe|g' \
            android/app/src/main/cpp/CMakeLists.txt

          echo "===== CMakeLists.txt ====="
          cat android/app/src/main/cpp/CMakeLists.txt

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketaero-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
